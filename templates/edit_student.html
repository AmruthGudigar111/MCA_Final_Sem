<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4 mb-4">Edit Student</h2>
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                <div class="alert alert-info">{{ messages[0] }}</div>
                            {% endif %}
                        {% endwith %}
                        <form action="{{ url_for('edit_student', student_id=student.student_id) }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Student ID</label>
                                <input type="text" class="form-control" value="{{ student.student_id }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Registration Number</label>
                                <input type="text" name="reg_number" class="form-control" value="{{ student.reg_number }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Combination</label>
                                <select class="form-select" name="combination" required>
                                    <option value="PCMB" {% if student.combination == 'PCMB' %}selected{% endif %}>PCMB</option>
                                    <option value="PCMC" {% if student.combination == 'PCMC' %}selected{% endif %}>PCMC</option>
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{{ url_for('manage_students') }}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Save changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
