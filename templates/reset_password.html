<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Student Performance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #667eea 0%, #764ba2 40%, #0a0f3d 100%);
            color: #fff;
        }
        .reset-card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .reset-card .card-body {
            padding: 35px;
        }
        .reset-title {
            letter-spacing: 0.08em;
            font-weight: 700;
        }
        .form-control {
            border-radius: 12px;
        }
        .btn-reset {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(17,153,142,0.25);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-3x text-white mb-3"></i>
                    <h2 class="reset-title">Reset Password</h2>
                    <p class="text-white-50">Enter your new password</p>
                </div>
                <div class="card reset-card shadow-sm">
                    <div class="card-body">
                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-warning" role="alert">
                                {{ messages[0] }}
                            </div>
                        {% endif %}
                        {% endwith %}

                        <form action="{{ url_for('reset_password') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label text-white">New Password</label>
                                <input type="password" class="form-control form-control-lg" name="password" required minlength="6">
                                <div class="form-text text-white-50">Must be at least 6 characters long</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">Confirm New Password</label>
                                <input type="password" class="form-control form-control-lg" name="confirm_password" required minlength="6">
                                <div class="form-text text-white-50">Re-enter your new password</div>
                            </div>

                            <button type="submit" class="btn btn-reset w-100">Reset Password</button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="{{ url_for('login_page') }}" class="text-white-50">Remember your password? Login here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
