<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'Error' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .error-card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
        }
        .error-card h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .error-card p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #f0f0f0;
        }
        .error-card .btn {
            width: 180px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
        <h1>{{ title or 'Page Not Found' }}</h1>
        <p>{{ message or 'The requested information could not be loaded. Please try again or contact the administrator.' }}</p>
        <a href="{{ return_url or url_for('dashboard') }}" class="btn btn-light btn-lg">
            <i class="fas fa-arrow-left"></i> Go Back
        </a>
    </div>
</body>
</html>
