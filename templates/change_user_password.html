<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change User Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #667eea 0%, #764ba2 40%, #0a0f3d 100%);
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .card-body {
            padding: 35px;
        }
        .form-control {
            border-radius: 12px;
        }
        .btn-submit {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(17,153,142,0.25);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <i class="fas fa-key fa-3x text-white mb-3"></i>
                    <h2>Change Password</h2>
                    <p class="text-white-50">Update password for {{ user.full_name or user.username }}</p>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-warning" role="alert">
                                {{ messages[0] }}
                            </div>
                        {% endif %}
                        {% endwith %}
                        <form action="{{ url_for('change_user_password', user_id=user.user_id) }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control form-control-lg" name="password" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control form-control-lg" name="confirm_password" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-submit w-100">Update Password</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('manage_users') }}" class="text-white-50">Back to Manage Users</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
